<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhfikra Apps</title>
    
    <!-- CSS Utama -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Font Awesome untuk Ikon Mobile -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Container Utama: Otomatis Fullscreen di HP/Tablet & Berbentuk HP di Desktop -->
    <div class="device-container">
        <!-- Frame Notch HP Decorative (Hanya tampil saat dibuka di Laptop/Desktop) -->
        <div class="phone-notch"></div>

        <!-- Header Navigasi -->
        <header>
            <!-- Tombol Kembali (Navigasi SPA Gesture Anti-Closed) -->
            <button id="btn-back" class="btn-back-nav" onclick="window.history.back()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 id="header-title">Muhfikra Apps</h2>
        </header>

        <!-- Main Content Area (Berubah secara dinamis via JS Hash Router) -->
        <main id="app-content">
            <!-- Konten halaman akan dimuat oleh app.js -->
        </main>

        <!-- Modal Detail Siswa (Hanya Read-Only) -->
        <div id="student-modal" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3><i class="fa-solid fa-id-card text-primary"></i> Rincian Data Siswa</h3>
                    <button class="btn-close" onclick="closeStudentModal()">&times;</button>
                </div>
                <div class="modal-body" id="modal-detail-body">
                    <!-- Data rincian siswa akan diisi dinamis via JavaScript -->
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary full-width" onclick="closeStudentModal()">Tutup Rincian</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Aplikasi -->
    <script src="js/app.js"></script>
</body>
</html>
